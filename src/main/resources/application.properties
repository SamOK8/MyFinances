spring.application.name=MyFinances
spring.datasource.url=jdbc:mysql://localhost:3306/finances_dev
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
finnhub.api.key=d0s82c9r01qkkpltir50d0s82c9r01qkkpltir5g
coinmarketcap.api.key=03477fb4bf2048ae8e68b7b45e0b2384

# Quartz configuration (using JDBC job store)
spring.quartz.enabled=true
spring.quartz.scheduler-name=myfinances-scheduler
spring.quartz.instance-id=AUTO
spring.quartz.overwrite-existing-jobs=true
spring.quartz.job-store-type=jdbc
spring.quartz.properties.org.quartz.jobStore.class=org.quartz.impl.jdbcjobstore.JobStoreTX
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.dataSource.myDS.driver=com.mysql.cj.jdbc.Driver
spring.quartz.properties.org.quartz.dataSource.myDS.URL=${spring.datasource.url}
spring.quartz.properties.org.quartz.dataSource.myDS.user=${spring.datasource.username}
spring.quartz.properties.org.quartz.dataSource.myDS.password=${spring.datasource.password}
spring.quartz.properties.org.quartz.dataSource.myDS.maxConnections=10
spring.quartz.properties.org.quartz.jobStore.dataSource=myDS
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.quartz.properties.org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

## Disable Flyway migrations (DB version MySQL 8.4 not recognized by Flyway in this environment)
#spring.flyway.enabled=false
## Use Spring Boot built-in Quartz JDBC schema initialization instead
spring.quartz.jdbc.initialize-schema=always

